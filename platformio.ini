; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `native` is a test-only environment with no main() of its own, so a bare
; `pio run` must not try to build it. Reach it explicitly: `pio test -e native`.
[platformio]
default_envs = car_wire, car_ota

[common]
framework = arduino
platform = espressif32
board = wemos_d1_uno32
board_build.partitions = partition.csv
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.6
	adafruit/Adafruit Motor Shield V2 Library@^1.1.3
	bblanchon/ArduinoJson@^7.0.4
	jvpernis/PS3 Controller Host@^1.1.0
	links2004/WebSockets@^2.5.3
	martinsos/HCSR04@^2.0.0

[env:car_wire]
extends = common
monitor_speed = 115200
upload_port = /dev/cu.usbserial*
monitor_filters = esp32_exception_decoder

[env:car_ota]
extends = common
monitor_speed = 115200
upload_protocol = espota
; Must match the static IP configured in src/Service.cpp.
upload_port = 192.168.0.115

; Host-side unit tests for src/Kinematics.cpp -- the decision and clamping
; logic, which is deliberately free of Arduino dependencies so it can run here.
; Everything else in src/ needs the board, so build_src_filter excludes it.
;
;   ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<Kinematics.cpp>
build_flags = -std=c++17 -I src
