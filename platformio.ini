; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `native` is a test-only environment with no main() of its own, and the
; gamepad build is opt-in, so a bare `pio run` builds just the two flashable
; environments. Reach the others explicitly: `pio test -e native`,
; `pio run -e car_wire_gamepad`.
[platformio]
default_envs = car_wire, car_ota

; Versions are pinned exactly, platform included, so CI builds the library set
; that was reviewed and flashed rather than whatever is newest that day.
; Bump them deliberately, one at a time, and re-run everything.
[common]
framework = arduino
platform = espressif32 @ 6.12.0
board = wemos_d1_uno32
board_build.partitions = partition.csv
; The board and the host tests (env:native) share the one pin.
arduinojson = bblanchon/ArduinoJson @ 7.3.1
lib_deps =
	madhephaestus/ESP32Servo @ 3.0.6
	adafruit/Adafruit Motor Shield V2 Library @ 1.1.3
	${common.arduinojson}
	jvpernis/PS3 Controller Host @ 1.1.0
	links2004/WebSockets @ 2.6.1
	martinsos/HCSR04 @ 2.0.0
; WebSockets 2.6.1 uses WEBSOCKETS_TCP_TIMEOUT in two units: milliseconds for
; reading the rest of a frame, but SECONDS for WiFiClient::setTimeout, which
; bounds each read of the handshake. Its default of 5000 therefore lets one
; stray byte sent to port 81 hold loop() -- and the motors -- for 83 minutes.
; At 2, a handshake read gives up after 2 s of silence. That is per character
; and per half-open client, all within one pass of loop(), so a peer that
; trickles bytes, or several stalled at once, can still hold it until the 5 s
; loop watchdog resets the board: the watchdog, not this value, is the real
; bound. A frame split across packets is dropped after 2 ms (commands are one
; small packet).
build_flags =
	-D WEBSOCKETS_TCP_TIMEOUT=2

[env:car_wire]
extends = common
monitor_speed = 115200
upload_port = /dev/cu.usbserial*
monitor_filters = esp32_exception_decoder

; Builds without the gamepad. On a gamepad rover, default ROVER_ENABLE_GAMEPAD
; to 1 in src/Features.h, or an OTA update removes the pad.
[env:car_ota]
extends = common
monitor_speed = 115200
upload_protocol = espota
; Must match the static IP configured in src/Network.cpp (with DHCP,
; rover.local). If src/config.h sets an OTA password, pass it for the one
; upload, never here: git tracks this file.
;   PLATFORMIO_UPLOAD_FLAGS=--auth=<password> pio run -e car_ota -t upload
upload_port = 192.168.0.115

; car_wire with the PS3 gamepad compiled in (see src/Features.h). CI builds it
; so the gamepad path keeps compiling while it is switched off by default.
[env:car_wire_gamepad]
extends = env:car_wire
build_flags =
	${common.build_flags}
	-D ROVER_ENABLE_GAMEPAD=1

; Host-side unit tests for the logic that has no Arduino dependencies:
; kinematics, the wheel patterns, exploration, the rover's mode and deadline
; handling, the gamepad's rules, and the JSON protocol. Everything else in
; src/ needs the board, so build_src_filter keeps it out. The board compiles
; as gnu++11, so the tests do too: code that only builds under a newer
; standard must fail here first.
;
;   ~/.platformio/penv/bin/pio test -e native
[env:native]
platform = native @ 1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = +<Kinematics.cpp> +<MovePatterns.cpp> +<Explorer.cpp> +<Rover.cpp> +<GamepadSession.cpp> +<Protocol.cpp>
build_flags = -std=gnu++11 -Wall -I src
lib_deps =
	${common.arduinojson}
