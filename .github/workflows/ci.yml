name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository, so no step -- or third-party action --
# gets a token that could.
permissions:
  contents: read

# Pinned once for both jobs. PlatformIO is pinned like the platform and
# libraries in platformio.ini, so a new release cannot change the build under
# an unchanged commit.
env:
  PYTHON_VERSION: '3.12'
  PLATFORMIO_VERSION: '6.1.19'

jobs:
  test:
    name: Unit tests (host)
    runs-on: ubuntu-latest
    # A backstop: a test that never ends fails by name under its own limit
    # (extras/joystick/test/harness.js), but anything else that hangs would
    # hold the job to GitHub's six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The clients carry copies of the protocol, and a drifted copy fails
      # quietly on the robot (tools/check_protocol.py says what it compares).
      - name: Check clients against the wire protocol
        run: python tools/check_protocol.py
      # The hook that keeps the WiFi credentials out of an agent's transcript,
      # against its case table, under dash and mawk as a Linux contributor
      # would run it.
      - name: Secrets guard
        run: python .claude/hooks/test_guard.py
      # The panel's scripts run in a browser, and their tests in Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The checker reads the clients with regular expressions and never runs
      # them, so a syntax error in one passes it. Parse each for real: every
      # script the panel loads (joy.js included) and its tests.
      - name: Parse the clients
        run: |
          python -m py_compile client/drive.py client/ws.py
          for script in extras/joystick/joy.js extras/joystick/js/*.js extras/joystick/test/*.js; do
            node --check "$script"
          done
      # The browser panel against a fake DOM, WebSocket and clock: what it
      # sends for every press, release, blur and link loss, its copy of the
      # stick mapping against test/vectors/stick_moves.json, and the
      # simulator's copies of the firmware (wheel table, sweep timing,
      # telemetry, the command duration cap), which check_protocol.py does
      # not read.
      - name: Panel tests
        run: node --test extras/joystick/test/
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==$PLATFORMIO_VERSION"
      # The host-tested modules have no Arduino dependencies, so this needs no
      # toolchain and no config.h -- build_src_filter keeps the rest of src/ out.
      - name: Run tests
        run: pio test -e native

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install "platformio==$PLATFORMIO_VERSION"
      # src/config.h is gitignored because it holds real WiFi credentials, and
      # only src/Network.cpp includes it. The template compiles identically,
      # which is all a build check needs.
      - name: Provide placeholder credentials
        run: cp src/config.example.h src/config.h
      - name: Build the default environments (car_wire, car_ota)
        run: pio run
      # Opt-in, so not a default environment. Built here so the gamepad path
      # keeps compiling while it is switched off.
      - name: Build with the gamepad compiled in
        run: pio run -e car_wire_gamepad
